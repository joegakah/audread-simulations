<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inertia Virtual Experiment</title>
    <script src="./inertia-virtual-simulation_files/saved_resource"></script>
    <style>
        :root {
            --trolley-x: 0px;
            --block-x: 0px;
        }

        .experiment-area {
            background: linear-gradient(to bottom, #e0f2fe 0%, #ffffff 100%);
            height: 300px;
            position: relative;
            overflow: hidden;
            border-bottom: 4px solid #444;
        }

        .trolley {
            width: 140px;
            height: 45px;
            background: #cbd5e1;
            border: 3px solid #475569;
            position: absolute;
            bottom: 20px;
            left: var(--trolley-x);
            border-radius: 4px 15px 4px 4px;
            z-index: 10;
        }

        .trolley::before { /* Handle */
            content: '';
            position: absolute;
            top: -40px;
            left: 10px;
            width: 6px;
            height: 40px;
            background: #475569;
        }

        .wheel {
            width: 22px;
            height: 22px;
            background: #1e293b;
            border: 2px solid #000;
            border-radius: 50%;
            position: absolute;
            bottom: -12px;
        }

        .block {
            background: #d97706; /* Wood color */
            border: 2px solid #78350f;
            position: absolute;
            bottom: 68px; /* On top of trolley */
            left: calc(var(--trolley-x) + var(--block-x) + 40px);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            transition: width 0.2s, height 0.2s;
        }

        .barrier {
            width: 60px;
            height: 45px; /* Reduced height to match trolley body */
            background: #4b5563;
            border: 3px solid #1f2937;
            position: absolute;
            bottom: 20px;
            right: 10%;
            z-index: 5;
        }

        .ground-texture {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 20px;
            background: repeating-linear-gradient(
                45deg,
                #ccc,
                #ccc 10px,
                #bbb 10px,
                #bbb 20px
            );
        }

        .motion-arrow {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ef4444;
            font-weight: 800;
            font-size: 1.5rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .diag-label {
            position: absolute;
            font-size: 12px;
            font-weight: bold;
            color: #334155;
        }
    </style>

<body class="bg-slate-50 p-4 md:p-8">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-2xl overflow-hidden border border-slate-200">
        <!-- Header -->
        

        <!-- Simulation Screen -->
        <div class="experiment-area" id="stage">
            <div id="motionLabel" class="motion-arrow" style="opacity: 0;">Motion ⟶</div>
            
            <div id="trolley" class="trolley" style="--trolley-x: 605px;">
                <div class="wheel" style="left: 15px;"></div>
                <div class="wheel" style="right: 15px;"></div>
            </div>

            <div id="block" class="block" style="--trolley-x: 605px; --block-x: 66px; width: 32px; height: 32px;">
                <span id="blockLabel">1kg</span>
            </div>

            <div class="barrier" id="barrier"></div>
            
            <div class="diag-label" style="bottom: 75px; left: 10px;">Trolley</div>
            <div class="diag-label" id="labelInertia" style="bottom: 125px; left: 100px;">Wooden block</div>
            <div class="diag-label" style="bottom: 70px; right: 5%;">Barrier</div>

            <div class="ground-texture"></div>
        </div>

        <!-- Controls -->
        <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-8 bg-slate-50">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2 __web-inspector-hide-shortcut__">
                        Object Mass: <span id="massDisplay" class="text-blue-600">1</span> kg
                    </label>
                    <input type="range" id="massSlider" min="1" max="20" value="5" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600" disabled="">
                    <div class="flex justify-between text-xs text-slate-500 mt-1">
                        <span>Low Inertia</span>
                        <span>High Inertia</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-center gap-4">
                <button id="btnPlay" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition-all active:scale-95 opacity-50 hidden" disabled="">
                    Start Experiment
                </button>
                <button id="btnReset" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-6 rounded-lg transition-all">
                    Reset
                </button>
            </div>
        </div>

        <!-- Educational Content -->
        
    </div>

    <script>
        const stage = document.getElementById('stage');
        const trolley = document.getElementById('trolley');
        const block = document.getElementById('block');
        const barrier = document.getElementById('barrier');
        const massSlider = document.getElementById('massSlider');
        const massDisplay = document.getElementById('massDisplay');
        const blockLabel = document.getElementById('blockLabel');
        const btnPlay = document.getElementById('btnPlay');
        const btnReset = document.getElementById('btnReset');
        const motionLabel = document.getElementById('motionLabel');

        let isRunning = false;
        let animationId = null;

        const startX = 50;
        const speed = 4;
        let mass = 5;

        function updateBlockSize() {
            mass = parseInt(massSlider.value);
            massDisplay.textContent = mass;
            blockLabel.textContent = mass + 'kg';
            const size = 30 + (mass * 2);
            block.style.width = `${size}px`;
            block.style.height = `${size}px`;
        }

        massSlider.addEventListener('input', () => {
            if (!isRunning) updateBlockSize();
        });

        function runExperiment() {
            if (isRunning) return;
            isRunning = true;
            
            btnPlay.disabled = true;
            btnPlay.classList.add('opacity-50');
            massSlider.disabled = true;
            motionLabel.style.opacity = '1';

            let currentX = startX;
            
            const trolleyWidth = 140;
            const barrierLeft = barrier.offsetLeft;
            const stopX = barrierLeft - trolleyWidth;

            function animate() {
                if (currentX < stopX) {
                    currentX += speed;
                    if (currentX > stopX) currentX = stopX;
                    
                    trolley.style.setProperty('--trolley-x', `${currentX}px`);
                    block.style.setProperty('--trolley-x', `${currentX}px`);
                    animationId = requestAnimationFrame(animate);
                } else {
                    motionLabel.style.opacity = '0';
                    handleCollision();
                }
            }
            animate();
        }

        function handleCollision() {
            let blockRelativeX = 0;
            const initialVelocity = speed;
            const friction = 0.05 / (mass * 0.4); 
            let currentVelocity = initialVelocity;

            function slideBlock() {
                if (currentVelocity > 0.1) {
                    blockRelativeX += currentVelocity;
                    currentVelocity -= friction;
                    block.style.setProperty('--block-x', `${blockRelativeX}px`);
                    animationId = requestAnimationFrame(slideBlock);
                } else {
                    btnReset.classList.remove('hidden');
                    btnPlay.classList.add('hidden');
                }
            }
            slideBlock();
        }

        function resetExperiment() {
            cancelAnimationFrame(animationId);
            isRunning = false;
            trolley.style.setProperty('--trolley-x', `${startX}px`);
            block.style.setProperty('--trolley-x', `${startX}px`);
            block.style.setProperty('--block-x', `0px`);
            btnPlay.disabled = false;
            btnPlay.classList.remove('opacity-50', 'hidden');
            btnReset.classList.add('hidden');
            massSlider.disabled = false;
            motionLabel.style.opacity = '0';
            updateBlockSize();
        }

        btnPlay.addEventListener('click', runExperiment);
        btnReset.addEventListener('click', resetExperiment);
        window.addEventListener('resize', resetExperiment);
        updateBlockSize();
    </script>

</body></html>
