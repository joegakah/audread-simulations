<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive 3D High School Chemistry Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1117;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #hud-header {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 20, 28, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 16px;
      color: #f0f4f8;
      pointer-events: none;
      max-width: 340px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }

    #hud-header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #hud-header h1 span.dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      display: inline-block;
    }

    #hud-header p {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }

    #toolbar {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      background: rgba(15, 20, 28, 0.76);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 8px 10px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
      z-index: 10;
    }

    .btn {
      background: rgba(255, 255, 255, 0.07);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: rgba(56, 189, 248, 0.5);
      color: #ffffff;
    }

    .btn.active {
      background: rgba(56, 189, 248, 0.28);
      border-color: #38bdf8;
      color: #ffffff;
    }

    .divider {
      width: 1px;
      background: rgba(255, 255, 255, 0.14);
      margin: 2px 4px;
    }

    #tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(10, 15, 24, 0.88);
      backdrop-filter: blur(8px);
      color: #f8fafc;
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      transform: translate(14px, -50%);
      transition: opacity 0.12s ease;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    #tooltip .state {
      color: #38bdf8;
      font-weight: 600;
      margin-left: 4px;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #cbd5e1;
      font-size: 14px;
      letter-spacing: 0.5px;
      z-index: 50;
      transition: opacity 0.4s ease;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container">
    <div id="loading">Initializing 3D Chemistry Lab...</div>

    <div id="hud-header">
      <h1><span class="dot"></span>High School Chemistry Lab</h1>
      <p>Drag to orbit · Scroll to zoom · Right-drag to pan<br>Click <b>Bunsen burners</b>, <b>faucets</b>, <b>fume hood sash</b>, <b>scales</b>, or <b>eyewash</b> to interact.</p>
    </div>

    <div id="tooltip"></div>

    <div id="toolbar">
      <button class="btn active" data-cam="overview">Overview</button>
      <button class="btn" data-cam="bench">Lab Island</button>
      <button class="btn" data-cam="demo">Demo Desk</button>
      <button class="btn" data-cam="fumehood">Fume Hood</button>
      <button class="btn" data-cam="board">Chalkboard &amp; Table</button>
      <div class="divider"></div>
      <button class="btn" id="btn-lighting">Mode: Daylight</button>
      <button class="btn" id="btn-burners">Ignite All Burners</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // -------------------------------------------------------------------------
    // Scene, Renderer, Camera & Post-Processing
    // -------------------------------------------------------------------------
    const container = document.getElementById('canvas-container');
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xbad4e8);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 80);
    camera.position.set(5.4, 2.55, 4.1);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(-0.4, 1.15, -0.4);
    controls.minDistance = 0.7;
    controls.maxDistance = 12;
    controls.maxPolarAngle = Math.PI * 0.49;

    // PMREM Environment for glass & metal reflections
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const roomEnv = new RoomEnvironment();
    scene.environment = pmremGenerator.fromScene(roomEnv, 0.04).texture;
    scene.environmentIntensity = 0.65;
    roomEnv.dispose();

    RectAreaLightUniformsLib.init();

    // Post-processing
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.2,   // subtle strength
      0.45,  // radius
      0.92   // high threshold so only bright lights/flames bloom
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    // -------------------------------------------------------------------------
    // Procedural Textures
    // -------------------------------------------------------------------------
    function createFloorTextures() {
      const size = 1024;
      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = colorCanvas.height = size;
      const ctx = colorCanvas.getContext('2d');

      const roughCanvas = document.createElement('canvas');
      roughCanvas.width = roughCanvas.height = size;
      const rCtx = roughCanvas.getContext('2d');

      // Base warm light gray linoleum tile
      ctx.fillStyle = '#d8dcd9';
      ctx.fillRect(0, 0, size, size);
      rCtx.fillStyle = '#484848'; // low-mid roughness (~0.28)
      rCtx.fillRect(0, 0, size, size);

      const tiles = 4;
      const tileSize = size / tiles;

      // Subtle tile-to-tile tonal variation
      for (let tx = 0; tx < tiles; tx++) {
        for (let ty = 0; ty < tiles; ty++) {
          const shade = 212 + Math.floor(Math.random() * 12);
          ctx.fillStyle = `rgb(${shade}, ${shade + 3}, ${shade + 1})`;
          ctx.fillRect(tx * tileSize + 3, ty * tileSize + 3, tileSize - 6, tileSize - 6);
        }
      }

      // Terrazzo / linoleum speckles
      const speckColors = ['#b4bab7', '#9aa19e', '#eef1ef', '#828a87', '#c7ccc8'];
      for (let i = 0; i < 16000; i++) {
        const x = Math.random() * size;
        const y = Math.random() * size;
        const r = 0.6 + Math.random() * 2.1;
        ctx.fillStyle = speckColors[i % speckColors.length];
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();

        const rVal = 55 + Math.floor(Math.random() * 45);
        rCtx.fillStyle = `rgb(${rVal},${rVal},${rVal})`;
        rCtx.fillRect(x, y, r, r);
      }

      // Grout lines
      ctx.strokeStyle = '#9ca3a0';
      ctx.lineWidth = 4;
      rCtx.strokeStyle = '#c8c8c8'; // matte grout
      rCtx.lineWidth = 5;
      for (let i = 0; i <= tiles; i++) {
        const pos = i * tileSize;
        ctx.beginPath(); ctx.moveTo(pos, 0); ctx.lineTo(pos, size); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, pos); ctx.lineTo(size, pos); ctx.stroke();
        rCtx.beginPath(); rCtx.moveTo(pos, 0); rCtx.lineTo(pos, size); rCtx.stroke();
        rCtx.beginPath(); rCtx.moveTo(0, pos); rCtx.lineTo(size, pos); rCtx.stroke();
      }

      const map = new THREE.CanvasTexture(colorCanvas);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.repeat.set(7, 5);
      map.anisotropy = 8;

      const roughnessMap = new THREE.CanvasTexture(roughCanvas);
      roughnessMap.wrapS = roughnessMap.wrapT = THREE.RepeatWrapping;
      roughnessMap.repeat.set(7, 5);

      return { map, roughnessMap };
    }

    function createCinderblockTexture() {
      const w = 512, h = 512;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = w; bumpCanvas.height = h;
      const bCtx = bumpCanvas.getContext('2d');

      ctx.fillStyle = '#ecebe4';
      ctx.fillRect(0, 0, w, h);
      bCtx.fillStyle = '#c8c8c8';
      bCtx.fillRect(0, 0, w, h);

      // Plaster grain
      for (let i = 0; i < 18000; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const g = 224 + Math.floor(Math.random() * 26);
        ctx.fillStyle = `rgb(${g},${g - 1},${g - 5})`;
        ctx.fillRect(x, y, 2, 2);

        const bg = 175 + Math.floor(Math.random() * 55);
        bCtx.fillStyle = `rgb(${bg},${bg},${bg})`;
        bCtx.fillRect(x, y, 2, 2);
      }

      // Subtle painted cinderblock seams
      const rows = 8;
      const cols = 4;
      const rh = h / rows;
      const cw = w / cols;
      ctx.strokeStyle = 'rgba(180, 178, 170, 0.45)';
      ctx.lineWidth = 2;
      bCtx.strokeStyle = '#707070';
      bCtx.lineWidth = 3;

      for (let r = 0; r <= rows; r++) {
        const y = r * rh;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        bCtx.beginPath(); bCtx.moveTo(0, y); bCtx.lineTo(w, y); bCtx.stroke();
        if (r < rows) {
          const offset = (r % 2) * (cw * 0.5);
          for (let c = 0; c <= cols; c++) {
            const x = (c * cw + offset) % w;
            ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + rh); ctx.stroke();
            bCtx.beginPath(); bCtx.moveTo(x, y); bCtx.lineTo(x, y + rh); bCtx.stroke();
          }
        }
      }

      const map = new THREE.CanvasTexture(canvas);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.repeat.set(4, 2);

      const bumpMap = new THREE.CanvasTexture(bumpCanvas);
      bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
      bumpMap.repeat.set(4, 2);

      return { map, bumpMap };
    }

    function createOakWoodTexture() {
      const w = 512, h = 512;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#b47d47';
      ctx.fillRect(0, 0, w, h);

      // Wood grain lines
      for (let i = 0; i < 240; i++) {
        const y = (i / 240) * h;
        const alpha = 0.08 + Math.random() * 0.14;
        ctx.strokeStyle = i % 3 === 0 ? `rgba(92, 54, 22, ${alpha})` : `rgba(210, 160, 102, ${alpha})`;
        ctx.lineWidth = 1 + Math.random() * 2.5;
        ctx.beginPath();
        ctx.moveTo(0, y);
        const amp = 4 + Math.random() * 10;
        const freq = 0.008 + Math.random() * 0.015;
        const phase = Math.random() * Math.PI * 2;
        for (let x = 0; x <= w; x += 16) {
          ctx.lineTo(x, y + Math.sin(x * freq + phase) * amp);
        }
        ctx.stroke();
      }

      // Fine pores
      for (let i = 0; i < 2500; i++) {
        ctx.fillStyle = 'rgba(72, 40, 14, 0.22)';
        ctx.fillRect(Math.random() * w, Math.random() * h, 10 + Math.random() * 24, 1);
      }

      const map = new THREE.CanvasTexture(canvas);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.anisotropy = 8;
      return map;
    }

    function createCeilingTileTexture() {
      const size = 512;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#eef0ef';
      ctx.fillRect(0, 0, size, size);

      // Acoustic stipple pinholes
      for (let i = 0; i < 3500; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? '#cfd4d2' : '#dfe3e1';
        ctx.fillRect(Math.random() * size, Math.random() * size, 2, 2);
      }

      // T-bar grid
      ctx.strokeStyle = '#c8cdcb';
      ctx.lineWidth = 8;
      ctx.strokeRect(0, 0, size, size);
      ctx.beginPath();
      ctx.moveTo(size / 2, 0); ctx.lineTo(size / 2, size);
      ctx.moveTo(0, size / 2); ctx.lineTo(size, size / 2);
      ctx.stroke();

      const map = new THREE.CanvasTexture(canvas);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.repeat.set(14, 10);
      return map;
    }

    function createChalkboardTexture() {
      const w = 2048, h = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');

      // Deep slate green
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#1e3b2c');
      grad.addColorStop(0.5, '#193527');
      grad.addColorStop(1, '#1d392b');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // Subtle erased chalk dust clouds
      for (let i = 0; i < 65; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const r = 40 + Math.random() * 140;
        const g = ctx.createRadialGradient(x, y, 4, x, y, r);
        g.addColorStop(0, 'rgba(255,255,255,0.035)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Header
      ctx.fillStyle = 'rgba(245, 248, 242, 0.9)';
      ctx.font = 'bold 52px "Comic Sans MS", "Chalkboard SE", cursive, sans-serif';
      ctx.fillText('AP CHEMISTRY — Acid-Base Titration & Redox Lab', 70, 95);
      ctx.strokeStyle = 'rgba(245, 248, 242, 0.6)';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(70, 118); ctx.lineTo(1480, 118); ctx.stroke();

      // Stoichiometry & Equations
      ctx.font = '38px "Comic Sans MS", "Chalkboard SE", cursive, sans-serif';
      ctx.fillStyle = 'rgba(255, 245, 190, 0.92)';
      ctx.fillText('1. Neutralization:', 80, 210);
      ctx.fillStyle = 'rgba(240, 248, 245, 0.88)';
      ctx.fillText('HCl(aq) + NaOH(aq)  →  NaCl(aq) + H₂O(l)', 110, 270);

      ctx.fillStyle = 'rgba(170, 230, 255, 0.92)';
      ctx.fillText('2. Copper(II) Sulfate Hydration:', 80, 370);
      ctx.fillStyle = 'rgba(240, 248, 245, 0.88)';
      ctx.fillText('CuSO₄(s) + 5 H₂O(l)  ⇌  CuSO₄·5H₂O(aq)   [Blue]', 110, 430);

      ctx.fillStyle = 'rgba(245, 195, 255, 0.92)';
      ctx.fillText('3. Ideal Gas Law & Molarity:', 80, 535);
      ctx.fillStyle = 'rgba(240, 248, 245, 0.88)';
      ctx.fillText('PV = nRT       M = moles / V(L)       pH = -log[H₃O⁺]', 110, 595);

      // Draw Benzene ring diagram
      ctx.strokeStyle = 'rgba(255, 245, 190, 0.85)';
      ctx.lineWidth = 5;
      const bx = 300, by = 780, br = 95;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i * Math.PI) / 3 - Math.PI / 6;
        const px = bx + Math.cos(a) * br;
        const py = by + Math.sin(a) * br;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(bx, by, br * 0.62, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255, 245, 190, 0.88)';
      ctx.font = '32px "Comic Sans MS", cursive, sans-serif';
      ctx.fillText('C₆H₆ (Benzene)', 190, 930);

      // Draw Titration Curve on the right half
      const gx = 1220, gy = 780, gw = 640, gh = 480;
      ctx.strokeStyle = 'rgba(245, 250, 245, 0.85)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(gx, gy - gh);
      ctx.lineTo(gx, gy);
      ctx.lineTo(gx + gw, gy);
      ctx.stroke();

      ctx.font = '30px "Comic Sans MS", cursive, sans-serif';
      ctx.fillStyle = 'rgba(245, 250, 245, 0.88)';
      ctx.fillText('pH', gx - 65, gy - gh + 20);
      ctx.fillText('14', gx - 55, gy - gh + 60);
      ctx.fillText('7', gx - 40, gy - gh / 2 + 10);
      ctx.fillText('0', gx - 40, gy + 5);
      ctx.fillText('Volume NaOH Added (mL)', gx + 140, gy + 60);

      // S-curve
      ctx.strokeStyle = '#7dd3fc';
      ctx.lineWidth = 7;
      ctx.beginPath();
      for (let i = 0; i <= 100; i++) {
        const t = i / 100;
        const px = gx + 30 + t * (gw - 70);
        const ph = 1.5 + 11 / (1 + Math.exp(-(t - 0.52) * 22));
        const py = gy - (ph / 14) * (gh - 40);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();

      // Equivalence point marker
      const eqX = gx + 30 + 0.52 * (gw - 70);
      const eqY = gy - (7 / 14) * (gh - 40);
      ctx.fillStyle = '#fda4af';
      ctx.beginPath();
      ctx.arc(eqX, eqY, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillText('Equiv. Point (pH 7.0)', eqX + 20, eqY + 8);

      // Safety reminder
      ctx.fillStyle = '#fde047';
      ctx.font = 'bold 34px "Comic Sans MS", cursive, sans-serif';
      ctx.fillText('SAFETY: Goggles ON at all times!', 580, 930);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    function createPeriodicTableTexture() {
      const w = 2048, h = 1220;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 10;
      ctx.strokeRect(16, 16, w - 32, h - 32);

      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 56px Inter, Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('PERIODIC TABLE OF THE ELEMENTS', w / 2, 92);

      const elements = [
        [1,'H',1,1,'nm'],[2,'He',18,1,'ng'],
        [3,'Li',1,2,'am'],[4,'Be',2,2,'ae'],[5,'B',13,2,'mt'],[6,'C',14,2,'nm'],[7,'N',15,2,'nm'],[8,'O',16,2,'nm'],[9,'F',17,2,'hl'],[10,'Ne',18,2,'ng'],
        [11,'Na',1,3,'am'],[12,'Mg',2,3,'ae'],[13,'Al',13,3,'pm'],[14,'Si',14,3,'mt'],[15,'P',15,3,'nm'],[16,'S',16,3,'nm'],[17,'Cl',17,3,'hl'],[18,'Ar',18,3,'ng'],
        [19,'K',1,4,'am'],[20,'Ca',2,4,'ae'],[21,'Sc',3,4,'tm'],[22,'Ti',4,4,'tm'],[23,'V',5,4,'tm'],[24,'Cr',6,4,'tm'],[25,'Mn',7,4,'tm'],[26,'Fe',8,4,'tm'],[27,'Co',9,4,'tm'],[28,'Ni',10,4,'tm'],[29,'Cu',11,4,'tm'],[30,'Zn',12,4,'tm'],[31,'Ga',13,4,'pm'],[32,'Ge',14,4,'mt'],[33,'As',15,4,'mt'],[34,'Se',16,4,'nm'],[35,'Br',17,4,'hl'],[36,'Kr',18,4,'ng'],
        [37,'Rb',1,5,'am'],[38,'Sr',2,5,'ae'],[39,'Y',3,5,'tm'],[40,'Zr',4,5,'tm'],[41,'Nb',5,5,'tm'],[42,'Mo',6,5,'tm'],[43,'Tc',7,5,'tm'],[44,'Ru',8,5,'tm'],[45,'Rh',9,5,'tm'],[46,'Pd',10,5,'tm'],[47,'Ag',11,5,'tm'],[48,'Cd',12,5,'tm'],[49,'In',13,5,'pm'],[50,'Sn',14,5,'pm'],[51,'Sb',15,5,'mt'],[52,'Te',16,5,'mt'],[53,'I',17,5,'hl'],[54,'Xe',18,5,'ng'],

      ctx.fillRect(0, 0, w, 96);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 38px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('LAB SAFETY RULES', w / 2, 62);

      const rules = [
        '1. Wear safety goggles at all times.',
        '2. Tie back long hair & loose clothing.',
        '3. Never taste or directly smell chemicals.',
        '4. Know eyewash & shower locations.',
        '5. Add acid to water, never reverse.',
        '6. Report spills & broken glass.',

    function createBeakerGeometry(radius = 0.05, height = 0.13) {
      const t = 0.003;
      const pts = [
        new THREE.Vector2(0, 0),
        new THREE.Vector2(radius - 0.004, 0),
        new THREE.Vector2(radius, 0.005),
        new THREE.Vector2(radius, height - 0.005),
        new THREE.Vector2(radius + 0.005, height),
        new THREE.Vector2(radius + 0.002, height + 0.003),
        new THREE.Vector2(radius - t, height - 0.003),
        new THREE.Vector2(radius - t, 0.006),
        new THREE.Vector2(0, 0.004)
      ];
      return new THREE.LatheGeometry(pts, 32);
    }

    function createErlenmeyerGeometry(baseR = 0.062, neckR = 0.02, height = 0.165) {
      const t = 0.003;
      const pts = [
        new THREE.Vector2(0, 0),
        new THREE.Vector2(baseR - 0.006, 0),
        new THREE.Vector2(baseR, 0.008),
        new THREE.Vector2(baseR, 0.028),
        new THREE.Vector2(neckR, height * 0.72),
        new THREE.Vector2(neckR, height - 0.006),
        new THREE.Vector2(neckR + 0.005, height),
        new THREE.Vector2(neckR + 0.002, height + 0.003),
        new THREE.Vector2(neckR - t, height - 0.005),
        new THREE.Vector2(neckR - t, height * 0.72),
        new THREE.Vector2(baseR - t, 0.028),
        new THREE.Vector2(baseR - t - 0.004, 0.006),
        new THREE.Vector2(0, 0.005)
      ];
      return new THREE.LatheGeometry(pts, 32);
    }

    function createGraduatedCylinderGeometry(radius = 0.024, height = 0.24) {
      const t = 0.0025;
      const baseR = radius * 1.65;
      const pts = [
        new THREE.Vector2(0, 0),
        new THREE.Vector2(baseR, 0),
        new THREE.Vector2(baseR, 0.008),
        new THREE.Vector2(radius, 0.015),
        new THREE.Vector2(radius, height - 0.004),
        new THREE.Vector2(radius + 0.004, height),
        new THREE.Vector2(radius - t, height - 0.002),
        new THREE.Vector2(radius - t, 0.015),
        new THREE.Vector2(0, 0.012)
      ];
      return new THREE.LatheGeometry(pts, 28);
    }

    function createRoundFlaskGeometry(bulbR = 0.058, neckR = 0.018, height = 0.17) {
      const t = 0.0028;
      const pts = [];
      const cy = bulbR + 0.005;
      // Outer bulb arc
      for (let i = 0; i <= 14; i++) {
        const a = -Math.PI / 2 + (i / 14) * (Math.PI * 0.83);
        const r = Math.max(neckR, Math.cos(a) * bulbR);
        const y = cy + Math.sin(a) * bulbR;
        if (i === 0) pts.push(new THREE.Vector2(0, 0.005));
        pts.push(new THREE.Vector2(Math.cos(a) * bulbR, y));
        if (y > cy && Math.cos(a) * bulbR <= neckR) break;
      }
      pts.push(new THREE.Vector2(neckR, height - 0.005));
      pts.push(new THREE.Vector2(neckR + 0.005, height));
      pts.push(new THREE.Vector2(neckR - t, height));
      pts.push(new THREE.Vector2(neckR - t, cy + bulbR * 0.85));
      for (let i = 12; i >= 0; i--) {
        const a = -Math.PI / 2 + (i / 12) * (Math.PI * 0.78);
        const r = Math.max(0, Math.cos(a) * (bulbR - t));
        const y = cy + Math.sin(a) * (bulbR - t);
        pts.push(new THREE.Vector2(r, y));
      }
      return new THREE.LatheGeometry(pts, 30);
    }

    function createTestTubeGeometry(radius = 0.011, height = 0.13) {
      const t = 0.0015;
      const pts = [];
      for (let i = 0; i <= 8; i++) {
        const a = -Math.PI / 2 + (i / 8) * (Math.PI / 2);
        pts.push(new THREE.Vector2(Math.cos(a) * radius, radius + Math.sin(a) * radius));
      }
      pts.push(new THREE.Vector2(radius, height - 0.002));
      pts.push(new THREE.Vector2(radius + 0.002, height));
      pts.push(new THREE.Vector2(radius - t, height));
      pts.push(new THREE.Vector2(radius - t, radius));
      for (let i = 7; i >= 0; i--) {
        const a = -Math.PI / 2 + (i / 8) * (Math.PI / 2);
        pts.push(new THREE.Vector2(Math.cos(a) * (radius - t), radius + Math.sin(a) * (radius - t)));
      }
      return new THREE.LatheGeometry(pts, 20);
    }

    // Cached glassware geometries

      const glass = new THREE.Mesh(geo, glassMat);

      if (liquidMat) {
        const lh = h * fillRatio;
        const liq = new THREE.Mesh(new THREE.CylinderGeometry(r - 0.0045, r - 0.0045, lh, 28), liquidMat);
        liq.position.y = lh / 2 + 0.005;
        g.add(liq);

      return g;
    }

      if (liquidMat) {

    function createBunsenBurner(valveWorldOffset, id, initiallyLit = false, linkedBubbleGroup = null) {
      const g = new THREE.Group();

      // Cast-iron hexagonal/circular base

      base.position.y = 0.009;

      collar.position.y = 0.032;
      g.add(collar);

      // Chrome mixing barrel

      barrel.position.y = 0.102;
      barrel.castShadow = true;
      g.add(barrel);

      // Side gas inlet nipple
      const nipple = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.005, 0.025, 10), brassMat);
      nipple.rotation.z = Math.PI / 2;
      nipple.position.set(-0.022, 0.025, 0);
      g.add(nipple);

      // Curved rubber hose connecting burner nipple to valve offset
      const hoseCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-0.032, 0.025, 0),
        new THREE.Vector3(valveWorldOffset.x * 0.35, 0.008, valveWorldOffset.z * 0.35 + 0.08),
        new THREE.Vector3(valveWorldOffset.x * 0.75, 0.008, valveWorldOffset.z * 0.75 + 0.04),
        new THREE.Vector3(valveWorldOffset.x, valveWorldOffset.y, valveWorldOffset.z)
      ]);
      const hose = new THREE.Mesh(new THREE.TubeGeometry(hoseCurve, 24, 0.0055, 10, false), rubberMat);
      hose.castShadow = true;
      g.add(hose);

      // Dual-cone animated Bunsen flame
      const flameGroup = new THREE.Group();
      flameGroup.position.set(0, 0.16, 0);

      const outerFlame = new THREE.Mesh(
        new THREE.ConeGeometry(0.016, 0.085, 18),
        new THREE.MeshBasicMaterial({
          color: 0x3b82f6,
          transparent: true,
          opacity: 0.52,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      outerFlame.position.y = 0.042;
      flameGroup.add(outerFlame);

      const innerFlame = new THREE.Mesh(
        new THREE.ConeGeometry(0.008, 0.042, 16),
        new THREE.MeshBasicMaterial({
          color: 0x67e8f9,
          transparent: true,
          opacity: 0.92,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      innerFlame.position.y = 0.021;
      flameGroup.add(innerFlame);

      const flameLight = new THREE.PointLight(0x60a5fa, initiallyLit ? 0.95 : 0, 1.8, 2);
      flameLight.position.y = 0.05;
      flameGroup.add(flameLight);

      flameGroup.visible = initiallyLit;
      g.add(flameGroup);

      if (linkedBubbleGroup) {
        linkedBubbleGroup.visible = initiallyLit;
        animatedBubbles.push({ group: linkedBubbleGroup, burner: g });
      }

      const burnerData = {
        type: 'burner',
        id,
        lit: initiallyLit,
        flameGroup,
        flameLight,
        linkedBubbleGroup,
        label: 'Bunsen Burner',
        getStateText: () => burnerData.lit ? '[LIT — Click to extinguish]' : '[OFF — Click to ignite]',
        setLit: (val) => {
          burnerData.lit = val;
          flameGroup.visible = val;
          flameLight.intensity = val ? 0.95 : 0;
          if (linkedBubbleGroup) linkedBubbleGroup.visible = val;
        },
        toggle: () => burnerData.setLit(!burnerData.lit)
      };

      registerInteractive(g, burnerData);
      animatedFlames.push(burnerData);

      return g;
    }

      const W = 2.8, D = 1.3, H = 0.90;
      const topThick = 0.055;

      // Black epoxy resin countertop with cutouts for 2 sinks (x = ±1.02)
      // Built from clean countertop slabs around the two sink basins so sinks actually dip below surface!
      const sinkOffsetsX = [-1.02, 1.02];
      const sinkW = 0.36, sinkD = 0.32;

      // Center countertop slab between sinks
      const centerTop = new THREE.Mesh(new THREE.BoxGeometry(1.68, topThick, D), epoxyMat);
      centerTop.position.set(0, H - topThick / 2, 0);
      centerTop.castShadow = true;
      centerTop.receiveShadow = true;
      island.add(centerTop);

      // Outer end caps + front/back rails around each sink
      for (const sx of sinkOffsetsX) {
        const sign = Math.sign(sx);
        const outerCap = new THREE.Mesh(new THREE.BoxGeometry(0.20, topThick, D), epoxyMat);
        outerCap.position.set(sx + sign * (sinkW / 2 + 0.10), H - topThick / 2, 0);
        outerCap.castShadow = true;
        outerCap.receiveShadow = true;
        island.add(outerCap);

        const railD = (D - sinkD) / 2;
        for (const rz of [-1, 1]) {
          const rail = new THREE.Mesh(new THREE.BoxGeometry(sinkW, topThick, railD), epoxyMat);
          rail.position.set(sx, H - topThick / 2, rz * (sinkD / 2 + railD / 2));
          rail.castShadow = true;
          rail.receiveShadow = true;
          island.add(rail);
        }

        // Recessed black ceramic sink basin
        const basinBottom = new THREE.Mesh(new THREE.BoxGeometry(sinkW + 0.02, 0.02, sinkD + 0.02), ceramicSinkMat);
        basinBottom.position.set(sx, H - 0.18, 0);
        island.add(basinBottom);

        const wallThickness = 0.02;
        const wallH = 0.17;
        const wL = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, wallH, sinkD), ceramicSinkMat);
        wL.position.set(sx - sinkW / 2 + 0.01, H - 0.095, 0);
        const wR = wL.clone();
        wR.position.x = sx + sinkW / 2 - 0.01;
        const wF = new THREE.Mesh(new THREE.BoxGeometry(sinkW, wallH, wallThickness), ceramicSinkMat);
        wF.position.set(sx, H - 0.095, -sinkD / 2 + 0.01);
        const wB = wF.clone();
        wB.position.z = sinkD / 2 - 0.01;
        island.add(wL, wR, wF, wB);

        // Chrome drain strainer
        const drain = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.005, 16), chromeMat);
        drain.position.set(sx, H - 0.168, 0);
        island.add(drain);

        // Curved chrome gooseneck faucet
        const faucet = createGooseneckFaucet(`island-${index}-faucet-${sx > 0 ? 'R' : 'L'}`);
        faucet.position.set(sx, H, -sinkD / 2 - 0.05);
        island.add(faucet);
      }

      // Lower Oak Cabinetry with Knee-Space Cutouts
      // Center cabinet block + outer sink cabinet blocks, leaving knee spaces at x = ±0.55 on both sides
      const cabH = H - topThick - 0.08;
      const toeKickH = 0.08;

      // Center cabinet spine
      const centerCab = new THREE.Mesh(new THREE.BoxGeometry(0.66, cabH, D - 0.12), oakMat);
      centerCab.position.set(0, toeKickH + cabH / 2, 0);
      centerCab.castShadow = true;
      centerCab.receiveShadow = true;
      island.add(centerCab);

      const centerToe = new THREE.Mesh(new THREE.BoxGeometry(0.66, toeKickH, D - 0.18), darkMetalMat);
      centerToe.position.set(0, toeKickH / 2, 0);
      island.add(centerToe);

      // End sink cabinet pedestals
      for (const sx of [-1.14, 1.14]) {
        const endCab = new THREE.Mesh(new THREE.BoxGeometry(0.50, cabH, D - 0.12), oakMat);
        endCab.position.set(sx, toeKickH + cabH / 2, 0);
        endCab.castShadow = true;
        endCab.receiveShadow = true;
        island.add(endCab);

        const endToe = new THREE.Mesh(new THREE.BoxGeometry(0.48, toeKickH, D - 0.18), darkMetalMat);
        endToe.position.set(sx, toeKickH / 2, 0);
        island.add(endToe);

        // Cabinet door handles on both front & back faces
        for (const fz of [-1, 1]) {
          const doorPanel = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.48, 0.015), oakMat);
          doorPanel.position.set(sx, 0.38, fz * (D / 2 - 0.058));
          island.add(doorPanel);

          const drawerPanel = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.14, 0.015), oakMat);
          drawerPanel.position.set(sx, 0.72, fz * (D / 2 - 0.058));
          island.add(drawerPanel);

          const h1 = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.012, 0.024), chromeMat);
          h1.position.set(sx, 0.72, fz * (D / 2 - 0.04));
          const h2 = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.09, 0.024), chromeMat);
          h2.position.set(sx - 0.12 * Math.sign(sx), 0.45, fz * (D / 2 - 0.04));
          island.add(h1, h2);
        }
      }

      // Knee-space modesty panel divider down center X=0..±0.9
      const spine = new THREE.Mesh(new THREE.BoxGeometry(1.85, cabH, 0.24), oakMat);
      spine.position.set(0, toeKickH + cabH / 2, 0);
      spine.castShadow = true;
      island.add(spine);

      // 4 Lab Stools tucked neatly into the 4 knee spaces
      const stoolPositions = [
        [-0.56, -0.58], [0.56, -0.58],
        [-0.56,  0.58], [0.56,  0.58]
      ];
      for (const [stX, stZ] of stoolPositions) {
        const stool = createLabStool();
        stool.position.set(stX, 0, stZ);
        island.add(stool);
      }

      // Central Raised Reagent Shelf
      const shelfY = H + 0.34;
      const shelf = new THREE.Mesh(new THREE.BoxGeometry(1.45, 0.028, 0.28), epoxyMat);
      shelf.position.set(0, shelfY, 0);
      shelf.castShadow = true;
      shelf.receiveShadow = true;
      island.add(shelf);

      for (const px of [-0.62, 0.62]) {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.34, 14), chromeMat);
        post.position.set(px, H + 0.17, 0);
        post.castShadow = true;
        island.add(post);
      }

      // Brass Gas Turrets (2 per island)
      for (const gx of [-0.55, 0.55]) {
        const turret = createGasTurret();
        turret.position.set(gx, H, 0.05);
        island.add(turret);
      }

      // Reagent bottles on the raised shelf
      const reagents = [
        ['HCl', 'Hydrochloric Acid', '1.0 M', '#dc2626', true],
        ['NaOH', 'Sodium Hydroxide', '1.0 M', '#2563eb', false],
        ['CuSO₄', 'Copper Sulfate', '0.5 M', '#0284c7', false],
        ['KMnO₄', 'Potass. Permang.', '0.1 M', '#7e22ce', true],
        ['CH₃COOH', 'Acetic Acid', '2.0 M', '#ea580c', true]
      ];
      reagents.forEach((cfg, idx) => {
        const b = createReagentBottle(cfg[0], cfg[1], cfg[2], cfg[3], cfg[4]);
        b.position.set(-0.48 + idx * 0.24, shelfY + 0.014, (idx % 2 === 0 ? -0.03 : 0.04));
        island.add(b);

      // Chemistry Glassware & Equipment Props on each island
      // 1. Ring Stand + Flask + Interactive Bunsen Burner connected to gas turret
      const stand = createRingStandWithFlask(
        index % 2 === 0 ? liquidMaterials.copperSulfate : liquidMaterials.permanganate,

      );
      stand.position.set(-0.35, H, 0.35);
      island.add(stand);

      const burnerPos = new THREE.Vector3(-0.35, H, 0.375);
      const turretPos = new THREE.Vector3(-0.55, H + 0.04, 0.05);
      const burner = createBunsenBurner(
        turretPos.clone().sub(burnerPos),
        `island-${index}-burner`,
        index === 0, // Light one student island burner by default for visual interest
        stand.userData.bubbleGroup
      );
      burner.position.copy(burnerPos);
      island.add(burner);

      // 2. Beakers & Graduated Cylinders
      const bk1 = createBeaker(liquidMaterials.methylOrange, 0.62, true);
      bk1.position.set(0.32, H, 0.34);
      island.add(bk1);

      const bk2 = createBeaker(liquidMaterials.bromothymol, 0.55, false);
      bk2.position.set(0.50, H, 0.42);
      island.add(bk2);

      const cyl = createGraduatedCylinder(liquidMaterials.phenolphthalein, 0.7);
      cyl.position.set(0.68, H, 0.28);
      island.add(cyl);

      // 3. Test Tube Rack on opposite side
      const rack = createTestTubeRack([
        liquidMaterials.copperSulfate,
        liquidMaterials.phenolphthalein,
        liquidMaterials.methylOrange,
        liquidMaterials.bromothymol,
        liquidMaterials.permanganate
      ]);
      rack.position.set(-0.45, H, -0.34);
      rack.rotation.y = 0.15;
      island.add(rack);

      // 4. Digital Scale & Erlenmeyer Flask
      const scale = createDigitalScale(index % 2 === 1 ? '14.82 g' : '0.00 g', `island-${index}-scale`);
      scale.position.set(0.38, H, -0.35);
      scale.rotation.y = Math.PI;
      island.add(scale);

      const erl = createErlenmeyer(liquidMaterials.water, 0.48);
      erl.position.set(0.05, H, -0.32);
      island.add(erl);
    }

    // Create 4 student islands in a 2x2 grid
    createStudentLabIsland(-2.5, -0.75, 0);

        cab.add(stileL, stileR, railT, railB, handle);
      }
    }

      hoodFlask.position.set(-0.25, 0.98, 0.08);
      hood.add(hoodFlask);

      const hoodBeaker = createBeaker(liquidMaterials.copperSulfate, 0.6, true);
      hoodBeaker.position.set(0.28, 0.93, 0.1);
      hood.add(hoodBeaker);

      // Control panel indicator lights on right post
      const indicator = new THREE.Mesh(
        new THREE.BoxGeometry(0.06, 0.14, 0.02),
        new THREE.MeshStandardMaterial({ color: 0x064e3b, emissive: 0x22c55e, emissiveIntensity: 1.5 })

        id: 'fume-hood-sash',
        label: 'Fume Hood Glass Sash',
        getStateText: () => fumeHoodState.open ? '[OPEN — Click to lower sash]' : '[CLOSED — Click to raise sash]',
        toggle: () => {
          fumeHoodState.open = !fumeHoodState.open;
          fumeHoodState.targetY = fumeHoodState.open ? fumeHoodState.openY : fumeHoodState.closedY;
          hoodLight.intensity = fumeHoodState.open ? 2.1 : 1.2;
        }
      });
    }
    createFumeHood();

    // D. Emergency Eyewash & Safety Shower Station near Exit Door (X = 6.45, Z = -1.65)
    function createEyewashStation() {
      const st = new THREE.Group();
      st.position.set(6.45, 0, -1.65);
      scene.add(st);

      const yellowMat = new THREE.MeshStandardMaterial({ color: 0xeab308, roughness: 0.35, metalness: 0.3 });
      const greenPlasticMat = new THREE.MeshStandardMaterial({ color: 0x16a34a, roughness: 0.3, metalness: 0.05 });

      // Floor flange & vertical standpipe
      const flange = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.12, 0.03, 18), yellowMat);
      flange.position.y = 0.015;
      const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 2.38, 16), yellowMat);
      pipe.position.y = 1.19;
      pipe.castShadow = true;
      st.add(flange, pipe);

      // Overhead drench shower arm & cone head
      const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.45, 12), yellowMat);
      arm.rotation.z = Math.PI / 2;
      arm.position.set(-0.22, 2.35, 0);
      const showerCone = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.14, 20), greenPlasticMat);
      showerCone.position.set(-0.42, 2.26, 0);
      st.add(arm, showerCone);

      // Triangular pull rod
      const pullRod = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.52, 8), chromeMat);
      pullRod.position.set(-0.25, 2.08, 0.06);
      const triHandle = new THREE.Mesh(new THREE.TorusGeometry(0.055, 0.008, 8, 3), chromeMat);
      triHandle.position.set(-0.25, 1.79, 0.06);
      st.add(pullRod, triHandle);

      // Mid-height Eyewash bowl & twin nozzles
      const bowlArm = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.28, 12), yellowMat);
      bowlArm.rotation.z = Math.PI / 2;
      bowlArm.position.set(-0.14, 1.02, 0);
      const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.09, 0.10, 22), greenPlasticMat);
      bowl.position.set(-0.28, 1.05, 0);
      const pushPaddle = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.11, 0.10), greenPlasticMat);
      pushPaddle.position.set(-0.28, 1.13, 0.14);
      st.add(bowlArm, bowl, pushPaddle);

      // Test water sprays (toggled on click!)
      const sprayMat = new THREE.MeshPhysicalMaterial({
        color: 0xbae6fd,
        transparent: true,
        opacity: 0.7,
        roughness: 0.1
      });
      const sprayL = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.015, 0.16, 10), sprayMat);
      sprayL.position.set(-0.28, 1.15, -0.04);
      sprayL.rotation.z = 0.25;
      const sprayR = sprayL.clone();
      sprayR.position.z = 0.04;
      sprayL.visible = sprayR.visible = false;
      st.add(sprayL, sprayR);

      eyewashState.sprays.push(sprayL, sprayR);

      registerInteractive(st, {
        type: 'eyewash',
        id: 'eyewash-station',
        label: 'Emergency Eyewash & Safety Shower',
        getStateText: () => eyewashState.active ? '[TESTING SPRAY — Click to shut off]' : '[READY — Click to test eyewash]',
        toggle: () => {
          eyewashState.active = !eyewashState.active;
          eyewashState.timer = eyewashState.active ? 5.0 : 0;
          eyewashState.sprays.forEach(s => { s.visible = eyewashState.active; });
        }
      });
    }
    createEyewashStation();

    // Fire Extinguisher mounted on Right Wall (X = 6.86, Z = 0.6)
    const extGroup = new THREE.Group();
    extGroup.position.set(6.84, 1.05, 0.6);
    scene.add(extGroup);
    const extBody = new THREE.Mesh(
      new THREE.CylinderGeometry(0.075, 0.075, 0.42, 20),
      new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.3, metalness: 0.2 })
    );
    const extTop = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.025, 0.08, 12), darkMetalMat);
    extTop.position.y = 0.24;
    const extHorn = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.12, 12), rubberMat);
    extHorn.position.set(-0.07, 0.16, 0.04);
    extHorn.rotation.z = 0.5;
    extGroup.add(extBody, extTop, extHorn);

    // -------------------------------------------------------------------------
    // 4. Interactivity: Raycasting, Hover Tooltips, Camera Presets & Lighting Modes
    // -------------------------------------------------------------------------
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const tooltip = document.getElementById('tooltip');
    let hoveredInteractive = null;
    let pointerDownPos = { x: 0, y: 0 };

    function findInteractiveAncestor(obj) {
      let curr = obj;
      while (curr) {
        if (curr.userData && curr.userData.interactive) {
          return curr.userData.interactive;
        }
        curr = curr.parent;
      }
      return null;
    }

    function updateTooltipContent(item) {
      tooltip.innerHTML = `${item.label} <span class="state">${item.getStateText()}</span>`;
    }

    renderer.domElement.addEventListener('pointermove', (e) => {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(interactiveObjects, true);
      const hitItem = hits.length > 0 ? findInteractiveAncestor(hits[0].object) : null;

      if (hitItem) {
        hoveredInteractive = hitItem;
        renderer.domElement.style.cursor = 'pointer';
        updateTooltipContent(hitItem);
        tooltip.style.left = `${e.clientX}px`;
        tooltip.style.top = `${e.clientY}px`;
        tooltip.style.opacity = '1';
      } else {
        hoveredInteractive = null;
        renderer.domElement.style.cursor = 'grab';
        tooltip.style.opacity = '0';
      }
    });

    renderer.domElement.addEventListener('pointerdown', (e) => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
      // Cancel active camera tween when user manually orbits
      camTween.active = false;
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      if (dist > 6) return; // Ignore orbit drags

      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(interactiveObjects, true);
      if (hits.length > 0) {
        const item = findInteractiveAncestor(hits[0].object);
        if (item && item.toggle) {
          item.toggle();
          updateTooltipContent(item);
        }
      }
    });

    // Camera Presets
    const cameraPresets = {
      overview:  { pos: new THREE.Vector3(5.4, 2.55, 4.1),  target: new THREE.Vector3(-0.4, 1.15, -0.4) },
      bench:     { pos: new THREE.Vector3(-0.7, 1.55, 0.5), target: new THREE.Vector3(-2.5, 1.05, -0.75) },
      demo:      { pos: new THREE.Vector3(1.15, 1.55, -1.7),target: new THREE.Vector3(-0.45, 1.08, -3.3) },
      fumehood:  { pos: new THREE.Vector3(3.3, 1.75, 2.15), target: new THREE.Vector3(4.9, 1.45, 4.25) },
      board:     { pos: new THREE.Vector3(0.9, 2.15, -1.2), target: new THREE.Vector3(1.0, 2.15, -4.9) }
    };

    const camTween = {
      active: false,
      startPos: new THREE.Vector3(),
      endPos: new THREE.Vector3(),
      startTarget: new THREE.Vector3(),
      endTarget: new THREE.Vector3(),
      progress: 0
    };

    document.querySelectorAll('[data-cam]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-cam]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const preset = cameraPresets[btn.dataset.cam];
        if (!preset) return;
        camTween.startPos.copy(camera.position);
        camTween.endPos.copy(preset.pos);
        camTween.startTarget.copy(controls.target);
        camTween.endTarget.copy(preset.target);
        camTween.progress = 0;
        camTween.active = true;
      });
    });

    // Lighting Mode Toggle (Daylight vs Dramatic Evening Lab)
    let isEvening = false;
    const btnLighting = document.getElementById('btn-lighting');
    btnLighting.addEventListener('click', () => {
      isEvening = !isEvening;
      if (isEvening) {
        btnLighting.textContent = 'Mode: Evening Lab';
        btnLighting.classList.add('active');
        scene.background.setHex(0x0b1322);
        sunLight.intensity = 0.22;
        sunLight.color.setHex(0x6488cc);
        hemiLight.intensity = 0.16;
        scene.environmentIntensity = 0.3;
        ledPanelMat.emissiveIntensity = 0.35;
        ceilingRectLights.forEach(l => l.intensity = 1.1);
        skyBackdrop.material.color.setHex(0x0f1b33);
      } else {
        btnLighting.textContent = 'Mode: Daylight';
        btnLighting.classList.remove('active');
        scene.background.setHex(0xbad4e8);
        sunLight.intensity = 3.4;
        sunLight.color.setHex(0xfff1d6);
        hemiLight.intensity = 0.42;
        scene.environmentIntensity = 0.65;
        ledPanelMat.emissiveIntensity = 1.35;
        ceilingRectLights.forEach(l => l.intensity = 4.2);
        skyBackdrop.material.color.setHex(0xcce8ff);
      }
    });

    // Ignite / Extinguish All Burners Button
    const btnBurners = document.getElementById('btn-burners');
    let allLit = false;
    btnBurners.addEventListener('click', () => {
      allLit = !allLit;
      animatedFlames.forEach(b => b.setLit(allLit));
      btnBurners.textContent = allLit ? 'Extinguish All' : 'Ignite All Burners';
      btnBurners.classList.toggle('active', allLit);
    });

    // -------------------------------------------------------------------------
    // Resize & Animation Loop
    // -------------------------------------------------------------------------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      // Smooth camera preset interpolation
      if (camTween.active) {
        camTween.progress = Math.min(1, camTween.progress + dt * 1.4);
        const ease = 1 - Math.pow(1 - camTween.progress, 3);
        camera.position.lerpVectors(camTween.startPos, camTween.endPos, ease);
        controls.target.lerpVectors(camTween.startTarget, camTween.endTarget, ease);
        if (camTween.progress >= 1) camTween.active = false;
      }

      controls.update();

      // Floor & room boundary collision clamps (prevents camera clipping below y = 0.5)
      camera.position.y = Math.max(0.5, Math.min(3.85, camera.position.y));
      camera.position.x = THREE.MathUtils.clamp(camera.position.x, -6.65, 6.65);
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, -4.65, 4.65);
      controls.target.y = Math.max(0.25, Math.min(3.5, controls.target.y));

      // Animate Bunsen burner flames
      animatedFlames.forEach((b, idx) => {
        if (!b.lit) return;
        const flicker = 0.92 + Math.sin(elapsed * 22 + idx * 3.1) * 0.06 + Math.cos(elapsed * 37 + idx) * 0.04;
        b.flameGroup.scale.set(0.95 + flicker * 0.06, flicker, 0.95 + flicker * 0.06);
        b.flameLight.intensity = 0.85 + Math.sin(elapsed * 19 + idx) * 0.14;
      });

      // Animate boiling bubbles in heated flasks
      animatedBubbles.forEach(({ group }) => {
        if (!group.visible) return;
        group.children.forEach((bubble) => {
          bubble.position.y += bubble.userData.speed * dt;
          if (bubble.position.y > 0.07) {
            bubble.position.y = 0.0;
            bubble.position.x = (Math.random() - 0.5) * 0.05;
            bubble.position.z = (Math.random() - 0.5) * 0.05;
          }
        });
      });

      // Animate running faucet water streams
      animatedWaterStreams.forEach((f, idx) => {
        if (!f.flowing) return;
        const pulse = 0.88 + Math.sin(elapsed * 32 + idx) * 0.12;
        f.stream.scale.set(pulse, 1, pulse);
      });

      // Animate fume hood sliding sash
      if (fumeHoodState.sash) {
        fumeHoodState.sash.position.y = THREE.MathUtils.lerp(
          fumeHoodState.sash.position.y,
          fumeHoodState.targetY,
          Math.min(1, dt * 7)
        );
      }

      // Eyewash test spray auto-timer
      if (eyewashState.active) {
        eyewashState.timer -= dt;
        const jitter = 0.85 + Math.sin(elapsed * 40) * 0.15;
        eyewashState.sprays.forEach(s => s.scale.set(jitter, 1, jitter));
        if (eyewashState.timer <= 0) {
          eyewashState.active = false;
          eyewashState.sprays.forEach(s => { s.visible = false; });
        }
      }

      // Wall clock second hand
      if (clockSecondHand) {
        clockSecondHand.rotation.z = -elapsed * ((Math.PI * 2) / 60);
      }

      composer.render();
    }

    // Hide loading screen smoothly
    const loadingEl = document.getElementById('loading');
    loadingEl.style.opacity = '0';
    setTimeout(() => loadingEl.remove(), 450);

    animate();
  </script>
</body>
</html>
